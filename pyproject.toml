[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicpm-research"
version = "0.1.0"
description = "Auditable, single-worker MiniCPM5 pilot experiments"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
model = ["torch>=2.5,<3", "transformers>=4.51,<5", "huggingface-hub>=0.30,<1", "safetensors>=0.5,<1", "accelerate>=1,<2", "sentencepiece>=0.2,<1"]

[tool.setuptools.packages.find]
where = ["src"]
