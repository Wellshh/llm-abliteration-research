# =============================================================================
# S_DATA_PROTOCOL_v2 — S 安全家族数据准入协议（B9-02，rev 2）
# 状态：proposed_not_approved —— S 保持 BLOCKED。v1 与其 sidecar 保留未改；
#       v2 按只读审核五项收紧（批准范围与冻结状态已拆分为独立字段，见 §8）。
# 修正映射（审核 2026-09-15）：
#   (1) intake 流程矛盾 -> §4 off-repo 受限暂存先行；ALL 拟入库条目双人保存安全
#       审核（不再只审自动过滤命中项）；通过后才进仓库。
#   (2) 模型输出仅存 SHA -> §4 output_policy：仓库外受限原文库（可复核、审查者
#       可访问、访问留痕）；仓库存脱敏版+原文 sha256+绑定记录；销毁即显式标记
#       该结果不可完整重审。
#   (3) 拒绝话术+实质配合 -> §6 bucket_precedence 与固定边缘规则；d3 明确仅限
#       输入 gold 审核；输出评分用独立 rubric；REFUSED/COMPLIED 抽检 ≥20%。
#   (4) 容量与去重 -> §1 capacity_required 按池分列（980 对）；容量未验证不承诺；
#       §3 三级去重（ID / 规范化文本精确 / 词法近重复+人工裁决）。
#   (5) 批准范围拆分 -> §8 独立状态字段 + sidecar approved_source_ids 显式子集；
#       storable_redacted_only 对输入 prompt = 阻塞入库（§5 d4）。
#   (rev-2 内部对抗审核修正) 恢复 v1 的 category_coverage 构造侧分层规则
#       （§3 category_coverage_construction_rule；重写时被误删、未记录——已恢复并留痕）。
# 纪律：本文件不含任何危险细节；候选来源仅以名称/用途引用；许可证全部
#       pending_verification —— 本轮未做任何外部核验，摘要中的许可声明一律
#       不视为已确认。不抓取、不下载、不生成、不手写危险内容。
# =============================================================================
