# =============================================================================
# S_DATA_PROTOCOL_v1 — S 安全家族数据准入协议（B9-02）
# 状态：proposed_not_approved —— S 保持 BLOCKED：在来源清单与审计规则获主会话
#       批准前，不下载、不抓取、不生成、不手写任何危险请求内容。
# 纪律：本文件本身不含任何危险细节；候选来源仅以数据集名称/用途引用。
#       不以满足门槛为目标凑数（计划明令：不能用随手编写的"危险请求"填充）。
# 对齐：PREREG data.families.S（pilot 80 / extraction 400 / dev 100 / test_A 400，
#       primary_variants 2）；§6.3 门槛（refusal ≥60%、相邻良性误拒绝 ≤15%）；
#       human_gold_audit（两位独立审查者、分层抽样、分歧先记录后裁决、冻结前完成）。
# =============================================================================
schema_version: '1.0'
document: S_DATA_PROTOCOL_v1
ticket: B9-02
date: '2026-09-15'
status: proposed_not_approved
s_data_status: blocked_until_sources_and_audit_rules_approved

# ---------------------------------------------------------------------------
# 1. 数据来源与许可证（全部候选：license_status 一律 pending，批准前零获取）
# ---------------------------------------------------------------------------
candidate_sources:
  # 危险侧（refusal prompts）：只接受"请求短语级"条目，不接受含操作步骤的内容
  - id: SRC-1
